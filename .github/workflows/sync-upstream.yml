name: Sync with Upstream

# Keeps main == upstream/main (plus the nix overlay) and refreshes the pinned
# `upstream` flake input, so the stock packages the flake serves track upstream.
# Because a GITHUB_TOKEN push cannot cascade into nix-build.yml, the build +
# Cachix push runs here directly (via _nix.yml) rather than relying on a chained
# trigger. Runs every 6 hours and on demand; only pushes when upstream actually moved.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Merge upstream and bump the flake lock
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/outlmd/outl.git || true
          git fetch upstream main
          git checkout -B main origin/main

          # The overlay only ADDS files upstream never has (flake.nix,
          # hm-module.nix, FLAKE.md, these workflows), so this merge is
          # conflict-free by construction. A conflict means that invariant was
          # broken — stop loudly rather than push a botched merge.
          if ! git merge upstream/main --no-edit; then
            echo "::error::merge of upstream/main into main conflicted; the overlay must only add files upstream lacks. Aborting, not pushing."
            git merge --abort || true
            exit 1
          fi

          # Move the stock output to the freshly merged upstream revision.
          # Pin the override to the rev we just merged, NOT `main`: `nix flake
          # update` would otherwise resolve the input to upstream's *current*
          # tip, which may have moved since the fetch above, locking a rev newer
          # than the tree actually merged.
          UP=$(git rev-parse upstream/main)
          nix flake update upstream --override-input upstream "github:outlmd/outl/$UP"

          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "chore(nix): bump upstream flake.lock to $(git rev-parse --short upstream/main)"
          fi

      # Gate the push on the fixed-output hashes. After an upstream frontend
      # change the frontend `outputHash` in flake.nix goes stale. The FODs are
      # cheap (a JS bundle) and architecture-independent, so building them here
      # is representative of both runners and catches the fragile part long
      # before the full Rust desktop build. On a mismatch, extract the `got:`
      # hash from the error, patch flake.nix, commit, and retry — so the
      # workflow self-heals instead of failing every 6 hours until a human
      # bumps the hash.
      - name: Validate and refresh overlay FOD hashes
        run: |
          set -euo pipefail
          if nix build .#outl-desktop-frontend .#outl-desktop-frontend-dev --print-build-logs 2>&1; then
            echo "FOD hashes current."
          else
            GOT=$(nix build .#outl-desktop-frontend --print-build-logs 2>&1 \
              | grep -oP 'got:\s+\K\S+' | head -1 || true)
            if [ -z "$GOT" ]; then
              echo "::error::FOD build failed for a non-hash reason; not auto-fixing."
              exit 1
            fi
            OLD=$(grep -oP 'outputHash = "\K[^"]+' flake.nix | head -1)
            echo "Refreshing FOD hash: $OLD -> $GOT"
            sed -i "s|outputHash = \"$OLD\"|outputHash = \"$GOT\"|g" flake.nix
            git add flake.nix
            git commit -m "fix(nix): refresh frontend FOD hash to $GOT"
            nix build .#outl-desktop-frontend .#outl-desktop-frontend-dev --print-build-logs
            echo "FOD hash refreshed and verified."
          fi

      - name: Push main
        id: push
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin main
            echo "Advanced main onto upstream (rev $(git rev-parse --short HEAD))."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date with upstream — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  nix:
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/_nix.yml
    with:
      ref: refs/heads/main
    secrets: inherit
