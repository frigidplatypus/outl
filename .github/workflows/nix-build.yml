name: Nix Build & Cache

# Trigger surface only. The build + Cachix push lives in _nix.yml (workflow_call)
# so sync-upstream.yml can reuse the exact same job after it advances main.

on:
  workflow_dispatch:
  push:
    branches: [main, dev, experimental]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'hm-module.nix'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/nix-build.yml'
      - '.github/workflows/_nix.yml'
  pull_request:
    branches: [main, dev, experimental]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'hm-module.nix'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/nix-build.yml'
      - '.github/workflows/_nix.yml'

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    uses: ./.github/workflows/_nix.yml
    secrets: inherit
