name: Nix Build & Cache (reusable)

# Single owner of "build the flake packages and push them to the outl Cachix
# cache". Invoked by nix-build.yml (push / PR / manual) and by sync-upstream.yml
# after it advances main onto a new upstream revision. Kept as a workflow_call
# reusable so the build logic exists in exactly one place.
#
# The sync path CANNOT rely on chaining: a push made with the default
# GITHUB_TOKEN does not fire other workflows (GitHub loop protection), so
# sync-upstream.yml calls this directly instead of waiting for nix-build.yml.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Empty means the triggering commit."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Linux only: outl packages are built for Linux (see flake.nix). macOS
    # users manage their config via home-manager but install outl themselves.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: outl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$)'

      - name: Build outl (CLI + TUI)
        run: nix build .#outl --print-build-logs

      - name: Build outl-desktop
        run: nix build .#outl-desktop --print-build-logs

      - name: Verify flake
        run: nix flake check --no-build
