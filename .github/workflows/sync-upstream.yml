name: Sync with Upstream

# Keeps main == upstream/main (plus the nix overlay) and refreshes the pinned
# `upstream` flake input, so the stock packages the flake serves track upstream.
# Because a GITHUB_TOKEN push cannot cascade into nix-build.yml, the build +
# Cachix push runs here directly (via _nix.yml) rather than relying on a chained
# trigger. Runs daily and on demand; only pushes when upstream actually moved.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Merge upstream and bump the flake lock
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/outlmd/outl.git || true
          git fetch upstream main
          git checkout -B main origin/main

          # The overlay only ADDS files upstream never has (flake.nix,
          # hm-module.nix, FLAKE.md, these workflows), so this merge is
          # conflict-free by construction. A conflict means that invariant was
          # broken — stop loudly rather than push a botched merge.
          if ! git merge upstream/main --no-edit; then
            echo "::error::merge of upstream/main into main conflicted; the overlay must only add files upstream lacks. Aborting, not pushing."
            git merge --abort || true
            exit 1
          fi

          # Move the stock output to the freshly merged upstream revision.
          # Pin the override to the rev we just merged, NOT `main`: `nix flake
          # update` would otherwise resolve the input to upstream's *current*
          # tip, which may have moved since the fetch above, locking a rev newer
          # than the tree actually merged.
          UP=$(git rev-parse upstream/main)
          nix flake update upstream --override-input upstream "github:outlmd/outl/$UP"

          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "chore(nix): bump upstream flake.lock to $(git rev-parse --short upstream/main)"
          fi

      # Gate the push on the fixed-output hashes. After an upstream frontend
      # change the frontend `outputHash` in flake.nix can go stale; if we pushed
      # first, every consumer would get a broken flake until a human fixed the
      # hash. The frontend FODs are cheap (a JS bundle) and architecture-
      # independent, so building them here is representative of both runners and
      # catches the fragile part long before the full Rust desktop build.
      - name: Validate overlay builds before advancing main
        run: |
          set -euo pipefail
          nix build .#outl-desktop-frontend .#outl-desktop-frontend-dev --print-build-logs

      - name: Push main
        id: push
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin main
            echo "Advanced main onto upstream (rev $(git rev-parse --short HEAD))."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date with upstream — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  nix:
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/_nix.yml
    with:
      ref: refs/heads/main
    secrets: inherit
